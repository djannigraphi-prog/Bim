name: iPhone (compilation sans signature)

# Vérifie que l'app se compile pour iPhone, sur un Mac de GitHub (gratuit pour un dépôt public).
# Aucune signature, aucun compte Apple : le fichier produit ne s'installe pas sur un téléphone.
# Si la partie iPhone (apps/mobile/ios) n'existe pas encore, elle est créée par Flutter, réglée (nom, autorisations)
# et publiée sur la branche « ci-ios-scaffold » pour être relue puis ajoutée au dépôt.
on:
  workflow_dispatch:
  push:
    branches: [main, 'v1-ios*']
    paths: ['apps/mobile/ios/**', 'apps/mobile/pubspec.yaml', '.github/workflows/ios.yml']

permissions:
  contents: write

jobs:
  ios:
    # Les Mac ARM de GitHub sont saturés (file d'attente annulée) : Mac Intel, gratuit aussi pour un dépôt public.
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter --version
      - name: Partie iPhone (création si absente)
        id: scaffold
        run: |
          if [ -d ios ]; then echo "created=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          flutter create --platforms=ios --org ci.bim --project-name bim .
          bash ../../.github/scripts/ios-configure.sh ios
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Publier la partie iPhone créée (branche ci-ios-scaffold)
        if: steps.scaffold.outputs.created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          work=$(mktemp -d)
          cp -R ios "$work/ios"
          cd "$work"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -q --orphan ci-ios-scaffold
          printf 'Partie iPhone créée par la CI (flutter create) à partir de %s.\n' "$GITHUB_SHA" > README.md
          git add -A
          git commit -q -m "Partie iPhone créée pour ${GITHUB_SHA}"
          git push -q -f origin ci-ios-scaffold
      - run: flutter pub get
      - name: Compilation iPhone sans signature
        run: flutter build ios --release --no-codesign
      - name: Taille du résultat
        run: du -sh build/ios/iphoneos/Runner.app
