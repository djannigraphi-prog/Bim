name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bim
          POSTGRES_PASSWORD: bim
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bim" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - name: Stockage compatible S3 qui applique les droits d'accès (local au runner)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/start-s3-test.sh"
      - run: npm run test:e2e -- --json --outputFile="$RUNNER_TEMP/e2e.json"
        env:
          TEST_DATABASE_ADMIN_URL: postgres://bim:bim@localhost:5432/postgres
      - name: Détail des tests en échec (annotations)
        if: ${{ failure() }}
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/jest-failures.py" "$RUNNER_TEMP/e2e.json" "$RUNNER_TEMP/e2e.short" || echo "rapport absent" > "$RUNNER_TEMP/e2e.short"
          python3 "$GITHUB_WORKSPACE/.github/scripts/annotate-chunks.py" "api e2e" "$RUNNER_TEMP/e2e.short" 6
      - name: Contrat OpenAPI à jour
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://bim:bim@localhost:5432/postgres
          JWT_ACCESS_SECRET: ci-only-secret-0123456789-abcdefghijkl
          OTP_SECRET: ci-only-otp-secret-0123456789-abcdefghij
          ADMIN_TOTP_ENCRYPTION_KEY: Y2ktb25seS1hZG1pbi10b3RwLWtleS0zMmJ5dGVzISE=
          LOG_LEVEL: error
        run: npm run openapi:export && git diff --exit-code ../../packages/api-contract/openapi.json
      - name: Image Docker de production (build, migrations, démarrage, santé)
        run: |
          docker build -t bim-api:ci .
          docker run --rm --network host -e NODE_ENV=production -e DATABASE_URL=postgres://bim:bim@localhost:5432/bim_docker \
            bim-api:ci node -e "const {Pool}=require('pg');new Pool({connectionString:'postgres://bim:bim@localhost:5432/postgres'}).query('create database bim_docker').then(()=>process.exit(0))"
          docker run --rm --network host -e DATABASE_URL=postgres://bim:bim@localhost:5432/bim_docker bim-api:ci node dist/database/migrate.js
          docker run -d --name bim-api --network host -e NODE_ENV=production -e TRUST_PROXY=1 \
            -e DATABASE_URL=postgres://bim:bim@localhost:5432/bim_docker \
            -e JWT_ACCESS_SECRET=ci-docker-access-secret-0123456789-abcd -e OTP_SECRET=ci-docker-otp-secret-0123456789-abcdefgh \
            -e ADMIN_TOTP_ENCRYPTION_KEY=Y2ktb25seS1hZG1pbi10b3RwLWtleS0zMmJ5dGVzISE= bim-api:ci
          for i in $(seq 1 30); do curl -sf localhost:3000/health && break; sleep 1; done
          curl -sf localhost:3000/health
          # En production : documentation désactivée, SMS factices refusés.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/docs)" = "404"
          docker rm -f bim-api
          if docker run --rm -e NODE_ENV=production -e SMS_PROVIDER=console -e DATABASE_URL=postgres://x:y@localhost/z \
               -e JWT_ACCESS_SECRET=ci-docker-access-secret-0123456789-abcd -e OTP_SECRET=ci-docker-otp-secret-0123456789-abcdefgh \
               -e ADMIN_TOTP_ENCRYPTION_KEY=Y2ktb25seS1hZG1pbi10b3RwLWtleS0zMmJ5dGVzISE= bim-api:ci; then
            echo "La production a démarré avec des SMS factices" && exit 1
          fi

  mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # uniquement pour publier les captures sur la branche ci-captures
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - name: Détail de l'analyseur (diagnostic, annotations)
        run: ../../.github/scripts/annotate-analyzer.sh
      - run: flutter analyze
      - name: Tests (exécutés même si l'analyse échoue, pour connaître leur état réel)
        if: ${{ !cancelled() }}
        # En cas d'échec, relance avec le rapport JSON : chaque test échoué devient une annotation lisible
        # (nom, erreur, ligne ; les journaux bruts ne sont pas toujours accessibles). Le résultat reste un échec.
        run: |
          flutter test || {
            flutter test --reporter json > "$RUNNER_TEMP/flutter-tests.jsonl" || true
            python3 ../../.github/scripts/flutter-test-annotate.py "$RUNNER_TEMP/flutter-tests.jsonl"
            exit 1
          }
      - name: Captures des écrans (comparaison avec les maquettes)
        if: ${{ !cancelled() }}
        run: |
          export FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          flutter test test_captures --update-goldens
      - name: Publier les captures (branche ci-captures)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ../../.github/scripts/publish-captures.sh
      - name: Compilation Android (debug)
        if: ${{ !cancelled() }}
        # En cas d'échec, la fin du journal de compilation est publiée en annotations (journaux bruts pas toujours lisibles).
        run: |
          set -o pipefail
          flutter build apk --debug --dart-define=BIM_API_URL=https://api.invalid 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            tail -n 60 "$RUNNER_TEMP/build.log" | cut -c1-200 > "$RUNNER_TEMP/build.short"
            python3 ../../.github/scripts/annotate-chunks.py "compilation android" "$RUNNER_TEMP/build.short" 3
            exit 1
          }

  # Application Android réelle (émulateur) contre l'API réelle (PostgreSQL neuf, migrations, mode développement).
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # uniquement pour publier les captures réelles de l'émulateur (branche ci-captures-android)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bim
          POSTGRES_PASSWORD: bim
          POSTGRES_DB: bim_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bim" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: info
      TRUST_PROXY: 0
      DATABASE_URL: postgres://bim:bim@localhost:5432/bim_e2e
      # Secrets jetables, propres à la CI (aucune valeur réelle).
      JWT_ACCESS_SECRET: ci-e2e-access-secret-0123456789-abcdefghij
      OTP_SECRET: ci-e2e-otp-secret-0123456789-abcdefghijklmno
      ADMIN_TOTP_ENCRYPTION_KEY: Y2ktb25seS1hZG1pbi10b3RwLWtleS0zMmJ5dGVzISE=
      SMS_PROVIDER: console
      EMAIL_PROVIDER: console
      MEDIA_STORAGE: local
      MEDIA_LOCAL_DIR: /tmp/bim-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Démarrer l'API
        working-directory: apps/api
        run: |
          npm ci
          npm run build
          node dist/database/migrate.js
          nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          nohup python3 ../../.github/scripts/otp-relay.py "$RUNNER_TEMP/api.log" 3999 "$RUNNER_TEMP/android-shots" > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/health && break; sleep 1; done
          curl -sf localhost:3000/health
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Activer KVM (émulateur accéléré)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Parcours inscription / connexion sur émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/mobile
          script: bash ../../.github/scripts/run-android-e2e.sh
      - name: Publier les captures réelles de l'émulateur (branche ci-captures-android)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ls "$RUNNER_TEMP"/android-shots/*.png >/dev/null 2>&1; then
            bash .github/scripts/publish-captures.sh "$RUNNER_TEMP/android-shots" ci-captures-android "émulateur Android 14, API 34, rendu réel"
          else
            echo "::warning title=captures android::Aucune capture réelle produite"; cat "$RUNNER_TEMP/relay.log" || true
          fi
      - name: Résumé (annotations lisibles hors des journaux)
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/e2e.log" ]; then
            sed -n '/: inscription, code/,$p' "$RUNNER_TEMP/e2e.log" \
              | grep -vE "^\s*$|^(I|D|V)/|\] *[0-9]+%|^(This is|Consider|The edge|black striped|seen\. If|ClipRect|like a ListView|RenderFlex to fit)" \
              | cut -c1-200 > "$RUNNER_TEMP/e2e.short"
            python3 "$GITHUB_WORKSPACE/.github/scripts/annotate-chunks.py" "e2e android" "$RUNNER_TEMP/e2e.short" 6
          fi
          if [ -s "$RUNNER_TEMP/logcat.short" ]; then
            cut -c1-200 "$RUNNER_TEMP/logcat.short" > "$RUNNER_TEMP/logcat.cut"
            python3 "$GITHUB_WORKSPACE/.github/scripts/annotate-chunks.py" "journal android" "$RUNNER_TEMP/logcat.cut" 4
          fi
          # Requêtes reçues par l'API (méthode, adresse, statut ; type et taille des envois), sans les corps ni les codes.
          python3 "$GITHUB_WORKSPACE/.github/scripts/api-requests.py" "$RUNNER_TEMP/api.log" > "$RUNNER_TEMP/api.short" || true
          grep -E "ERROR|Error" "$RUNNER_TEMP/api.log" | grep -v "ton code est" | cut -c1-300 >> "$RUNNER_TEMP/api.short" || true
          python3 "$GITHUB_WORKSPACE/.github/scripts/annotate-chunks.py" "api" "$RUNNER_TEMP/api.short" 3

  # Application web d'administration : types, tests unitaires, build, puis parcours réel dans Chromium contre l'API.
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bim
          POSTGRES_PASSWORD: bim
          POSTGRES_DB: bim_admin_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bim" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://bim:bim@localhost:5432/bim_admin_e2e
      # Secrets jetables, propres à la CI (aucune valeur réelle).
      JWT_ACCESS_SECRET: ci-admin-access-secret-0123456789-abcdefgh
      OTP_SECRET: ci-admin-otp-secret-0123456789-abcdefghijklm
      ADMIN_TOTP_ENCRYPTION_KEY: Y2ktb25seS1hZG1pbi10b3RwLWtleS0zMmJ5dGVzISE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/admin
      - run: npm run lint
        working-directory: apps/admin
      - run: npm test
        working-directory: apps/admin
      - run: npm run build
        working-directory: apps/admin
      - run: npx playwright install --with-deps chromium
        working-directory: apps/admin
      - name: Parcours administration dans un vrai navigateur
        run: .github/scripts/run-admin-e2e.sh 2>&1 | tee "$RUNNER_TEMP/admin-e2e.log"; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Résumé (annotations)
        if: ${{ failure() }}
        run: |
          grep -vE "^\s*$" "$RUNNER_TEMP/admin-e2e.log" | tail -150 | cut -c1-200 > "$RUNNER_TEMP/admin.short" || true
          python3 .github/scripts/annotate-chunks.py "admin e2e" "$RUNNER_TEMP/admin.short" 6
