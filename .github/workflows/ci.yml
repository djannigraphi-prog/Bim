name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bim
          POSTGRES_PASSWORD: bim
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bim" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:e2e
        env:
          TEST_DATABASE_ADMIN_URL: postgres://bim:bim@localhost:5432/postgres
      - name: Contrat OpenAPI à jour
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://bim:bim@localhost:5432/postgres
          JWT_ACCESS_SECRET: ci-only-secret-0123456789-abcdefghijkl
          OTP_SECRET: ci-only-otp-secret-0123456789-abcdefghij
          LOG_LEVEL: error
        run: npm run openapi:export && git diff --exit-code ../../packages/api-contract/openapi.json

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - name: Détail de l'analyseur (diagnostic, annotations)
        run: ../../.github/scripts/annotate-analyzer.sh
      - run: flutter analyze
      - name: Tests (exécutés même si l'analyse échoue, pour connaître leur état réel)
        if: ${{ !cancelled() }}
        run: flutter test
