name: bim
description: "BIM — Beauté, Image et Motivation. Application mobile Android et iOS."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # État : Riverpod, utilisé partout de la même façon (Notifier / AsyncNotifier). Voir docs/CONVENTIONS.md.
  flutter_riverpod: ^2.6.1
  # Navigation déclarative avec redirections selon la session.
  go_router: ^14.8.1
  # HTTP + intercepteur de session.
  dio: ^5.7.0
  # Jetons stockés dans le trousseau (iOS Keychain / Android Keystore), jamais en clair.
  flutter_secure_storage: ^9.2.4
  # Logos, mascotte Peni et cadeaux fournis en SVG.
  flutter_svg: ^2.0.16
  # Photos avant / après (appareil photo ou galerie), écrans 22 et 31.
  image_picker: ^1.1.2
  # Lot 11 : lecture des Reels (lecteur vidéo du téléphone, paquet officiel, gratuit).
  video_player: ^2.9.2
  # Rappels programmés sur le téléphone (lot 2) : notifications classiques, non exactes, actions « J'y vais ! / Plus tard ».
  flutter_local_notifications: ^22.3.0
  # Heure des rappels (en UTC, fournie par l'API).
  timezone: ^0.11.0
  # Lot 8 : page de paiement du prestataire ouverte dans le navigateur (paiement en ligne, désactivé par défaut).
  url_launcher: ^6.3.1
  # V1 : messages vocaux enregistrés sur le téléphone (AAC dans un fichier M4A), sans service payant.
  record: ^6.0.0
  # Dossier temporaire du vocal avant l'envoi.
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Tests de bout en bout sur émulateur Android (job CI « android-e2e »).
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/peni/
    - assets/gifts/
